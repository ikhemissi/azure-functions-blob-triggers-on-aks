# Environment of the GitHub Copilot cloud agent: .NET 10, Terraform with its providers cached, kubeconform and
# shellcheck, every dependency fetched here, before the agent's firewall applies, so that the agent can run the
# offline checks of AGENTS.md. No Azure access and no secrets: the agent never deploys.
name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  # The job MUST be called `copilot-setup-steps` for the Copilot cloud agent to pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Modules the agent adds reuse the providers fetched here.
      TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Terraform providers (root and modules)
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform -chdir=infra init -backend=false -input=false
          for module in infra/modules/*/; do terraform -chdir="$module" init -backend=false -input=false; done
      - name: Azure Functions templates and NuGet packages for the apps
        run: |
          dotnet new install Microsoft.Azure.Functions.Worker.ProjectTemplates
          if ls ./*.slnx >/dev/null 2>&1; then dotnet restore ./*.slnx; fi
      - name: kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v
      - name: shellcheck
        run: shellcheck --version
