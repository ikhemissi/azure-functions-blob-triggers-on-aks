apiVersion: apps/v1
kind: Deployment
metadata:
  name: blob-polling
  namespace: functions
  labels:
    app: blob-polling
    trigger: blob-polling
spec:
  replicas: {{ .Env.BLOB_POLLING_REPLICAS }}
  selector:
    matchLabels:
      app: blob-polling
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: blob-polling
        trigger: blob-polling
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: blob-polling
      terminationGracePeriodSeconds: 30
      containers:
        - name: blob-polling
          image: "{{ .Env.SERVICE_BLOB_POLLING_IMAGE_NAME }}"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: AzureFunctionsWebHost__hostid
              value: blob-polling
            - name: AzureWebJobsStorage__accountName
              value: "{{ .Env.HOST_ACCOUNT_1 }}"
            - name: AzureWebJobsStorage__credential
              value: workloadidentity
            - name: AzureWebJobsStorage__clientId
              value: "{{ .Env.BLOB_POLLING_CLIENT_ID }}"
            - name: FUNCTIONS_WORKER_RUNTIME
              value: dotnet-isolated
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              value: "{{ .Env.APPLICATIONINSIGHTS_CONNECTION_STRING }}"
            - name: PROCESSED_TABLE_URI
              value: "https://{{ .Env.HOST_ACCOUNT_1 }}.table.core.windows.net/processed"
            - name: UploadsStorage__blobServiceUri
              value: "https://{{ .Env.UPLOADS_ACCOUNT_1 }}.blob.core.windows.net"
            - name: UploadsStorage__queueServiceUri
              value: "https://{{ .Env.UPLOADS_ACCOUNT_1 }}.queue.core.windows.net"
            - name: UploadsStorage__credential
              value: workloadidentity
            - name: UploadsStorage__clientId
              value: "{{ .Env.BLOB_POLLING_CLIENT_ID }}"
            # No POD_NAMESPACE: with it, the Functions host takes the pod for App Service on Kubernetes and its locks
            # (the blob trigger's singleton scan) wait for a leader endpoint that doesn't exist here.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /admin/host/ping
              port: 80
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /admin/host/ping
              port: 80
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /admin/host/ping
              port: 80
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
