apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: queue-triggered
  namespace: functions
spec:
  scaleTargetRef:
    name: queue-triggered
  minReplicaCount: ${KEDA_MIN_REPLICAS}
  maxReplicaCount: ${KEDA_MAX_REPLICAS}
  triggers:
    - type: azure-queue
      metadata:
        accountName: ${UPLOADS_ACCOUNT_2}
        queueName: blob-events
        queueLength: "${KEDA_MESSAGES_PER_REPLICA}"
      authenticationRef:
        name: queue-triggered
