apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: queue-triggered
  namespace: functions
spec:
  scaleTargetRef:
    name: queue-triggered
  minReplicaCount: {{ .Env.KEDA_MIN_REPLICAS }}
  maxReplicaCount: {{ .Env.KEDA_MAX_REPLICAS }}
  triggers:
    - type: azure-queue
      metadata:
        accountName: "{{ .Env.UPLOADS_ACCOUNT_2 }}"
        queueName: blob-events
        queueLength: "{{ .Env.KEDA_MESSAGES_PER_REPLICA }}"
      authenticationRef:
        name: queue-triggered
