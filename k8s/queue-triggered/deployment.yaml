apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-triggered
  namespace: functions
  labels:
    app: queue-triggered
    trigger: storage-queue
spec:
  selector:
    matchLabels:
      app: queue-triggered
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: queue-triggered
        trigger: storage-queue
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: queue-triggered
      terminationGracePeriodSeconds: 30
      containers:
        - name: queue-triggered
          image: ${SERVICE_QUEUE_TRIGGERED_IMAGE_NAME}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: AzureFunctionsWebHost__hostid
              value: queue-triggered
            - name: AzureWebJobsStorage__accountName
              value: ${HOST_ACCOUNT_2}
            - name: AzureWebJobsStorage__credential
              value: workloadidentity
            - name: AzureWebJobsStorage__clientId
              value: ${QUEUE_TRIGGERED_CLIENT_ID}
            - name: FUNCTIONS_WORKER_RUNTIME
              value: dotnet-isolated
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              value: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
            - name: PROCESSED_TABLE_URI
              value: https://${HOST_ACCOUNT_2}.table.core.windows.net/processed
            - name: BlobEventsQueue__queueServiceUri
              value: https://${UPLOADS_ACCOUNT_2}.queue.core.windows.net
            - name: BlobEventsQueue__credential
              value: workloadidentity
            - name: BlobEventsQueue__clientId
              value: ${QUEUE_TRIGGERED_CLIENT_ID}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /admin/host/ping
              port: 80
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /admin/host/ping
              port: 80
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /admin/host/ping
              port: 80
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
