apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: servicebus-triggered
  namespace: functions
spec:
  scaleTargetRef:
    name: servicebus-triggered
  minReplicaCount: ${KEDA_MIN_REPLICAS}
  maxReplicaCount: ${KEDA_MAX_REPLICAS}
  triggers:
    - type: azure-servicebus
      metadata:
        namespace: ${SERVICE_BUS_NAMESPACE}
        queueName: blob-events
        messageCount: "${KEDA_MESSAGES_PER_REPLICA}"
      authenticationRef:
        name: servicebus-triggered
