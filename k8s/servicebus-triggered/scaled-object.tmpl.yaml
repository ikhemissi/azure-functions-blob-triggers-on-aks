apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: servicebus-triggered
  namespace: functions
spec:
  scaleTargetRef:
    name: servicebus-triggered
  minReplicaCount: {{ .Env.KEDA_MIN_REPLICAS }}
  maxReplicaCount: {{ .Env.KEDA_MAX_REPLICAS }}
  triggers:
    - type: azure-servicebus
      metadata:
        namespace: "{{ .Env.SERVICE_BUS_NAMESPACE }}"
        queueName: blob-events
        messageCount: "{{ .Env.KEDA_MESSAGES_PER_REPLICA }}"
      authenticationRef:
        name: servicebus-triggered
