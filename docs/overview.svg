<svg xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Three ways to trigger Azure Functions on AKS after a blob upload, with private networking</title>
  <desc id="desc">A client uploads a blob to one of three storage accounts, which sit outside the virtual network with their public access off. Row 1: the blob-polling app lists its container every 10 seconds through the account's blob private endpoint. Row 2: the account's Event Grid system topic, which has no subnet and no network security group, delivers a BlobCreated event into a Storage queue as a trusted service with its managed identity; the queue-triggered app polls the queue through the account's queue private endpoint, and KEDA scales it. Row 3: another system topic delivers the event into a Service Bus Premium queue, with public access off and trusted services allowed; the servicebus-triggered app receives from it over AMQP through the namespace's private endpoint. The private endpoints are in the private-endpoints subnet, 10.60.5.0/24, and the apps in the aks-nodes subnet, 10.60.0.0/22, both with network security groups, in the virtual network 10.60.0.0/16. Event Grid's deliveries don't go through the virtual network. Measured median latency for 20 concurrent blobs and own cost per month at a million blobs: polling 3 to 13 seconds and 8 euros; Storage queue 1.5 to 2.7 seconds with a 2-second polling interval and 2 euros; Service Bus 0.9 to 1.9 seconds and 608 euros for Premium.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4466"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#138a7a"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b1f3b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <style>
    text { fill: #1b1f3b; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 17px; fill: #4a5072; }
    .name { font-size: 15px; font-weight: 700; }
    .group { font-size: 15px; font-weight: 700; fill: #0b5cad; }
    .subnet { font-size: 13px; font-weight: 700; fill: #0b5cad; }
    .kind { font-size: 12.5px; fill: #4a5072; }
    .access { font-size: 12.5px; fill: #8a3b12; font-weight: 600; }
    .result { font-size: 13px; fill: #1b1f3b; font-weight: 600; }
    .edge { font-size: 12.5px; fill: #3d4466; font-weight: 600; }
    .grid { font-size: 12.5px; fill: #138a7a; font-weight: 600; }
    .footer { font-size: 14px; fill: #4a5072; }
  </style>

  <rect width="1200" height="720" fill="#f7f8fc"/>

  <text class="title" x="36" y="56">Three ways to trigger Azure Functions on AKS after a blob upload</text>
  <text class="subtitle" x="36" y="86">Phase 2: everything private, identities only. Measured median latency for 20 blobs, and each trigger's own cost a month at a million blobs.</text>

  <!-- Azure services outside the virtual network -->
  <rect x="126" y="112" width="580" height="470" rx="14" fill="#fbfbfd" stroke="#8a90ad" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text class="group" x="142" y="136" style="fill:#3d4466">Azure services, outside the virtual network</text>

  <!-- Virtual network and its subnets -->
  <rect x="762" y="112" width="426" height="470" rx="14" fill="#eef4fb" stroke="#0b5cad" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="group" x="778" y="136">Virtual network 10.60.0.0/16</text>
  <rect x="774" y="150" width="124" height="420" rx="10" fill="#ffffff" stroke="#0b5cad" stroke-dasharray="4 3"/>
  <text class="subnet" x="836" y="172" text-anchor="middle">private-endpoints</text>
  <text class="kind" x="836" y="190" text-anchor="middle">10.60.5.0/24 · NSG</text>
  <rect x="908" y="150" width="270" height="420" rx="10" fill="#ffffff" stroke="#0b5cad" stroke-dasharray="4 3"/>
  <text class="subnet" x="922" y="172">aks-nodes 10.60.0.0/22 · NSG</text>
  <text class="kind" x="922" y="190">AKS, namespace functions, KEDA</text>

  <!-- A client -->
  <g filter="url(#shadow)">
    <rect x="16" y="334" width="98" height="82" rx="12" fill="#ffffff" stroke="#3d4466" stroke-width="1.5"/>
  </g>
  <text class="name" x="65" y="368" text-anchor="middle">A client</text>
  <text class="kind" x="65" y="389" text-anchor="middle">uploads a blob</text>
  <line x1="114" y1="361" x2="136" y2="250" stroke="#3d4466" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="114" y1="375" x2="136" y2="375" stroke="#3d4466" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="114" y1="389" x2="136" y2="500" stroke="#3d4466" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 1 -->
  <g filter="url(#shadow)">
    <rect x="140" y="202" width="150" height="96" rx="12" fill="#ffffff" stroke="#3d4466" stroke-width="1.5"/>
  </g>
  <text class="name" x="215" y="234" text-anchor="middle">Upload account 1</text>
  <text class="kind" x="215" y="254" text-anchor="middle">container uploads</text>
  <text class="access" x="215" y="274" text-anchor="middle">public access off</text>
  <rect x="784" y="224" width="104" height="52" rx="8" fill="#eef4fb" stroke="#0b5cad"/>
  <text class="kind" x="836" y="244" text-anchor="middle">account 1</text>
  <text class="kind" x="836" y="264" text-anchor="middle">blob</text>
  <rect x="918" y="198" width="250" height="104" rx="10" fill="#f7f8fc" stroke="#c9cde3"/>
  <text class="name" x="932" y="222">blob-polling</text>
  <text class="kind" x="932" y="242">polling Blob trigger, 2 replicas</text>
  <text class="result" x="932" y="266">median 3 to 13 s · no KEDA</text>
  <text class="result" x="932" y="288">€8 a month</text>
  <line x1="918" y1="250" x2="892" y2="250" stroke="#3d4466" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="784" y1="250" x2="294" y2="250" stroke="#3d4466" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="edge" x="503" y="241" text-anchor="middle">lists the container every 10 s, reads new blobs</text>

  <!-- Row 2 -->
  <g filter="url(#shadow)">
    <rect x="140" y="327" width="150" height="96" rx="12" fill="#ffffff" stroke="#3d4466" stroke-width="1.5"/>
  </g>
  <text class="name" x="215" y="349" text-anchor="middle">Upload account 2</text>
  <text class="kind" x="215" y="369" text-anchor="middle">container uploads</text>
  <text class="access" x="215" y="389" text-anchor="middle">public access off,</text>
  <text class="access" x="215" y="409" text-anchor="middle">trusted: its system topic</text>
  <g filter="url(#shadow)">
    <rect x="334" y="327" width="124" height="96" rx="12" fill="#ffffff" stroke="#138a7a" stroke-width="1.5"/>
  </g>
  <text class="name" x="396" y="359" text-anchor="middle">Event Grid</text>
  <text class="kind" x="396" y="379" text-anchor="middle">system topic</text>
  <text class="access" x="396" y="399" text-anchor="middle">no subnet, no NSG</text>
  <line x1="290" y1="375" x2="330" y2="375" stroke="#138a7a" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text class="grid" x="311" y="366" text-anchor="middle">event</text>
  <g filter="url(#shadow)">
    <rect x="516" y="327" width="176" height="96" rx="12" fill="#ffffff" stroke="#3d4466" stroke-width="1.5"/>
  </g>
  <text class="name" x="604" y="349" text-anchor="middle">Storage queue</text>
  <text class="kind" x="604" y="369" text-anchor="middle">in account 2</text>
  <text class="access" x="604" y="389" text-anchor="middle">public access off,</text>
  <text class="access" x="604" y="409" text-anchor="middle">trusted: its system topic</text>
  <line x1="458" y1="375" x2="512" y2="375" stroke="#138a7a" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text class="grid" x="485" y="366" text-anchor="middle">delivers</text>
  <rect x="784" y="349" width="104" height="52" rx="8" fill="#eef4fb" stroke="#0b5cad"/>
  <text class="kind" x="836" y="369" text-anchor="middle">account 2</text>
  <text class="kind" x="836" y="389" text-anchor="middle">queue</text>
  <rect x="918" y="323" width="250" height="104" rx="10" fill="#f7f8fc" stroke="#c9cde3"/>
  <text class="name" x="932" y="347">queue-triggered</text>
  <text class="kind" x="932" y="367">Queue trigger, polling every 2 s</text>
  <text class="result" x="932" y="391">median 1.5 to 2.7 s · KEDA</text>
  <text class="result" x="932" y="413">€2 a month</text>
  <line x1="918" y1="375" x2="892" y2="375" stroke="#3d4466" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="784" y1="375" x2="696" y2="375" stroke="#3d4466" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="edge" x="737" y="366" text-anchor="middle">polls</text>

  <!-- Row 3 -->
  <g filter="url(#shadow)">
    <rect x="140" y="452" width="150" height="96" rx="12" fill="#ffffff" stroke="#3d4466" stroke-width="1.5"/>
  </g>
  <text class="name" x="215" y="474" text-anchor="middle">Upload account 3</text>
  <text class="kind" x="215" y="494" text-anchor="middle">container uploads</text>
  <text class="access" x="215" y="514" text-anchor="middle">public access off,</text>
  <text class="access" x="215" y="534" text-anchor="middle">trusted: its system topic</text>
  <g filter="url(#shadow)">
    <rect x="334" y="452" width="124" height="96" rx="12" fill="#ffffff" stroke="#138a7a" stroke-width="1.5"/>
  </g>
  <text class="name" x="396" y="484" text-anchor="middle">Event Grid</text>
  <text class="kind" x="396" y="504" text-anchor="middle">system topic</text>
  <text class="access" x="396" y="524" text-anchor="middle">no subnet, no NSG</text>
  <line x1="290" y1="500" x2="330" y2="500" stroke="#138a7a" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text class="grid" x="311" y="491" text-anchor="middle">event</text>
  <g filter="url(#shadow)">
    <rect x="516" y="452" width="176" height="96" rx="12" fill="#ffffff" stroke="#3d4466" stroke-width="1.5"/>
  </g>
  <text class="name" x="604" y="474" text-anchor="middle">Service Bus queue</text>
  <text class="kind" x="604" y="494" text-anchor="middle">Premium namespace</text>
  <text class="access" x="604" y="514" text-anchor="middle">public access off,</text>
  <text class="access" x="604" y="534" text-anchor="middle">trusted services</text>
  <line x1="458" y1="500" x2="512" y2="500" stroke="#138a7a" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text class="grid" x="485" y="491" text-anchor="middle">delivers</text>
  <rect x="784" y="474" width="104" height="52" rx="8" fill="#eef4fb" stroke="#0b5cad"/>
  <text class="kind" x="836" y="494" text-anchor="middle">Service Bus</text>
  <text class="kind" x="836" y="514" text-anchor="middle">namespace</text>
  <rect x="918" y="448" width="250" height="104" rx="10" fill="#f7f8fc" stroke="#c9cde3"/>
  <text class="name" x="932" y="472">servicebus-triggered</text>
  <text class="kind" x="932" y="492">Service Bus trigger (AMQP)</text>
  <text class="result" x="932" y="516">median 0.9 to 1.9 s · KEDA</text>
  <text class="result" x="932" y="538">€608 a month (Premium)</text>
  <line x1="918" y1="500" x2="892" y2="500" stroke="#3d4466" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="784" y1="500" x2="696" y2="500" stroke="#3d4466" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="edge" x="737" y="491" text-anchor="middle">receives</text>

  <!-- Footer -->
  <line x1="36" y1="612" x2="76" y2="612" stroke="#138a7a" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text class="footer" x="88" y="617">Event Grid delivers with its managed identity as a trusted service, over the Microsoft backbone: no subnet, no NSG, not through the private endpoints.</text>
  <line x1="36" y1="640" x2="76" y2="640" stroke="#3d4466" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="footer" x="88" y="645">The apps reach each account and Service Bus through its private endpoint with Workload Identity, and write one record per blob to their own host account.</text>
  <text class="footer" x="36" y="674">NSGs on the subnets (aks-nodes, private-endpoints, and the jumpbox's, not shown) govern the traffic inside the network, not Event Grid's deliveries.</text>
  <text class="footer" x="36" y="700">Exactly one processing per blob in every failure scenario, for all three. Phase 1 (public endpoints) gave the same results; Service Bus Standard costs €9 there.</text>
</svg>
