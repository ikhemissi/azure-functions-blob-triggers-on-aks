# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: azure-functions-blob-triggers-on-aks

# One Terraform root (infra/): each file is one part of the architecture, built from the modules in infra/modules;
# connections.tf wires the optional parts together. Put the spike's own resources in a new file of infra/.
infra:
  provider: terraform
  path: infra

# Each event runs the steps of infra/hooks/<event>/ in name order (infra/hooks/run.sh): what Terraform cannot do.
hooks:
  preprovision:
    posix:
      shell: sh
      run: bash ./infra/hooks/run.sh preprovision
      interactive: false
      continueOnError: false
  postprovision:
    posix:
      shell: sh
      run: bash ./infra/hooks/run.sh postprovision
      interactive: false
      continueOnError: false
  postdeploy:
    posix:
      shell: sh
      run: bash ./infra/hooks/run.sh postdeploy
      interactive: false
      continueOnError: false
  predown:
    posix:
      shell: sh
      run: bash ./infra/hooks/run.sh predown
      interactive: false
      continueOnError: false
  postdown:
    posix:
      shell: sh
      run: bash ./infra/hooks/run.sh postdown
      interactive: false
      continueOnError: false

services:
  blob-polling:
    host: aks
    language: dotnet
    project: ./src/BlobPollingFunction
    docker:
      path: ./Dockerfile
      context: ../..
      # Built in the registry (ACR Tasks): no local Docker, and the same path once the registry is private.
      remoteBuild: true
    k8s:
      deploymentPath: ../../k8s/blob-polling
      namespace: functions
      deployment:
        name: blob-polling
  queue-triggered:
    host: aks
    language: dotnet
    project: ./src/QueueTriggeredFunction
    docker:
      path: ./Dockerfile
      context: ../..
      # Built in the registry (ACR Tasks): no local Docker, and the same path once the registry is private.
      remoteBuild: true
    k8s:
      deploymentPath: ../../k8s/queue-triggered
      namespace: functions
      deployment:
        name: queue-triggered
  servicebus-triggered:
    host: aks
    language: dotnet
    project: ./src/ServiceBusTriggeredFunction
    docker:
      path: ./Dockerfile
      context: ../..
      # Built in the registry (ACR Tasks): no local Docker, and the same path once the registry is private.
      remoteBuild: true
    k8s:
      deploymentPath: ../../k8s/servicebus-triggered
      namespace: functions
      deployment:
        name: servicebus-triggered

  # The reaper of the Bastion sessions (infra/bastion-on-demand.tf): a Flex Consumption function app that deletes the
  # Bastion host and NAT Gateway of a session past its time and deallocates the jumpbox.
  bastion-reaper:
    project: ./functions/bastion-reaper/src/BastionReaper
    language: dotnet
    host: function
